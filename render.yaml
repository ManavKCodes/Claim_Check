services:
  - type: web
    name: claimcheck-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: claimcheck-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENFOODFACTS_USER_AGENT
        sync: false
      - key: OPENFOODFACTS_BASE_URL
        value: https://world.openfoodfacts.org

  - type: web
    name: claimcheck-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: claimcheck-db
    databaseName: claimcheck
    user: claimcheck
