services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claimcheck}
      POSTGRES_USER: ${POSTGRES_USER:-claimcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - claimcheck-postgres:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-claimcheck}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-claimcheck}
      ALLOWED_ORIGINS: http://localhost:8080
      OPENFOODFACTS_USER_AGENT: ClaimCheck/0.1 (configure-contact-before-production)
    ports:
      - "8000:8000"
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  claimcheck-postgres:
